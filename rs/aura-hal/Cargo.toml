[package]
name = "ttlcd-aura-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

# TTLcdAura.dll: Armoury Crate / Aura Sync HAL COM plugin (built for i686 and x86_64 Windows)
[lib]
name = "TTLcdAura"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Ole", "Win32_Foundation"] }
