[package]
name = "ttlcd-rescue"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ttrescue"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_IscsiDisc", "Win32_System_SystemInformation", "Win32_Security"] }
