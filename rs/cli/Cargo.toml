[package]
name = "ttlcd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ttlcd"
path = "src/main.rs"

[dependencies]
ttlcd-core = { path = "../core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
