[package]
name = "ttlcd-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "TTLcdStudio-Setup"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
