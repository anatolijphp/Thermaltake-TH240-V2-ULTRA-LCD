# Rust port (proof of concept). Built with the toolchain rs/fetch.sh (Linux) / rs\fetch.cmd (Windows) puts in tools/.
[workspace]
members = ["core", "cli", "studio", "aura-hal", "installer"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
