[package]
name = "ttlcd-studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ttlcd-studio"
path = "src/main.rs"

[dependencies]
ttlcd-core = { path = "../core" }
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
