name: build

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same compiler as on a plain Windows install: .NET Framework 4.8 csc (C# 5). No SDK, no packages.
      # Builds the app, the Aura plugin and the rescue tools into build\windows\app, and build\windows\TTLcdStudio-Setup.exe.
      - name: Build
        shell: cmd
        run: build.cmd

      - name: Check firmware checksums
        shell: pwsh
        run: |
          Get-Content firmware/SHA256SUMS.txt | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $actual = (Get-FileHash "firmware/$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "checksum mismatch: $name" }
          }

      - name: Installer smoke test (silent install + uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'TT LCD Studio'
          Start-Process build/windows/TTLcdStudio-Setup.exe -ArgumentList "/S `"/D=$dir`"" -Wait
          foreach ($f in 'ttlcd.exe','TTLcdStudio.exe','TTLcdAura.dll','Uninstall.exe','driver/MttVDD.inf','firmware/ttrescue.exe','firmware/lx800_tt021panel.bin') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          Start-Process (Join-Path $dir 'Uninstall.exe') -ArgumentList '/uninstall /S' -Wait
          Start-Sleep 8
          if (Test-Path $dir) { throw "install folder still there after uninstall" }

      # build\windows\app is already laid out like an install, so the portable zip is just that folder
      - name: Package
        shell: pwsh
        run: Compress-Archive build/windows/app/* build/windows/TTLcdStudio-portable.zip

      # the WPF window rendered off-screen, to compare with the Linux (GTK) screenshots
      - name: Screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots | Out-Null
          foreach ($p in 'dashboard','modes','device','settings') {
            Start-Process build/windows/app/TTLcdStudio.exe -ArgumentList "--screenshot `"$PWD/shots/windows-$p.png`" $p" -Wait
          }

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: shots/

      - uses: actions/upload-artifact@v4
        with:
          name: TTLcdStudio-windows
          path: |
            build/windows/TTLcdStudio-Setup.exe
            build/windows/TTLcdStudio-portable.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mono's C# compiler builds the same sources (build.sh takes the file list from build.cmd)
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-devel libgtk3.0-cil-dev >/dev/null

      - name: Build
        run: ./build.sh

      # A clean Ubuntu with nothing but the .deb and its dependencies: proves the package installs and the
      # renderer works there (the cooler itself isn't attached to CI).
      - name: Package test (clean Ubuntu 24.04)
        run: |
          docker run --rm -v "$PWD/build/linux:/pkg" ubuntu:24.04 sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/ttlcd_*_all.deb >/dev/null
            ttlcd >/dev/null || true
            ttlcd render /tmp/clock.jpg Clock
            ttlcd render /tmp/colour.jpg Color
            ttlcd set Mode Clock
            ttlcd config | grep -q "Mode = Clock"
            ttlcd probe || true
            test -s /tmp/clock.jpg && test -f /lib/udev/rules.d/60-ttlcd.rules && test -f /usr/lib/systemd/user/ttlcd.service
            # the Studio window under a virtual X display, one PNG per page
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth fonts-ubuntu >/dev/null
            mkdir -p /pkg/shots
            for p in dashboard modes:Clock modes:Image device settings idle; do
              xvfb-run -a -s "-screen 0 1400x1400x24" env TTLCD_SHOT_HEIGHT=1300 ttlcd-studio --screenshot /pkg/shots/linux-$(echo $p | tr : _).png $p
            done
            xvfb-run -a -s "-screen 0 1400x1400x24" env TTLCD_SHOT_HEIGHT=1300 TTLCD_SHOT_SELECT=ClkItems:0 ttlcd-studio --screenshot /pkg/shots/linux-modes_Clock_style.png modes:Clock
            test -s /pkg/shots/linux-dashboard.png
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: build/linux/shots/

      - uses: actions/upload-artifact@v4
        with:
          name: ttlcd-linux
          path: |
            build/linux/*.deb
            build/linux/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only the downloads (the screenshot artifacts are for review, not for the release)
      - uses: actions/download-artifact@v4
        with:
          name: TTLcdStudio-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ttlcd-linux
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
