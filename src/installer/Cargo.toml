[package]
name = "ttlcd-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

# the payload format (src/pack.rs), shared by both bins
[lib]
name = "ttlcd_setup"
path = "src/lib.rs"

# the installer / uninstaller (Windows; elsewhere it only prints a note)
[[bin]]
name = "TTLcdStudio-Setup"
path = "src/main.rs"

# host tool: ttlcd-pack <stub TTLcdStudio-Setup.exe> <app dir> <out.exe>
[[bin]]
name = "ttlcd-pack"
path = "src/bin/ttlcd-pack.rs"

[dependencies]
miniz_oxide = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM interfaces: IShellLinkW / IPersistFile (shortcuts), IFileOpenDialog (folder picker)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
